# The Windows installer. Built in CI on windows-latest: npm run dist
appId: app.managerplus.desktop
productName: Manager+
copyright: Manager+
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  # The SQLite engine is a native module; Windows loads it from disk.
  - node_modules/better-sqlite3/**
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64]
  # No code-signing certificate (decided 20 Nov): Windows SmartScreen asks once; see docs/install.
  signAndEditExecutable: true
  artifactName: Manager-Plus-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Manager+
  # Arabic first, then English.
  installerLanguages: [ar_SA, en_US]
  language: "1025"
  multiLanguageInstaller: true
  # Business files and backups live wherever the owner keeps them; uninstalling never touches them.
  deleteAppDataOnUninstall: false
