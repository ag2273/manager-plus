name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The checkout journey in Arabic and in English, in the built app.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - if: runner.os == 'Windows'
        run: npm run e2e

  # The Windows installer, unsigned (no code-signing certificate).
  installer:
    needs: check
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: The installer was built
        shell: bash
        run: ls -l dist/Manager-Plus-Setup-*.exe
      # From main, the newest installer replaces the one on the "latest-build" pre-release.
      # Releases don't count against the Actions artifact storage quota, which a 130 MB exe fills.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Publish to the latest-build pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --prerelease --title "Latest build (main)" --notes "The installer built from the newest commit on main. Not a customer release."
          gh release upload latest-build dist/Manager-Plus-Setup-*.exe --clobber
          gh release edit latest-build --notes "The installer built from main at $GITHUB_SHA. Not a customer release."
