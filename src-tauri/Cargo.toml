[package]
name = "manager-plus"
description = "Manager+ for Windows: the screens in WebView2, the books in the Rust core."
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "manager_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
manager-core = { path = "../crates/core" }
manager-lan = { path = "../crates/lan" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security_Cryptography"] }
