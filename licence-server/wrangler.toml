# The Manager+ licence server on Cloudflare Workers. See licence-server/README.md to deploy.
name = "manager-plus-licences"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "manager-plus-licences"
# Put the id that `wrangler d1 create manager-plus-licences` prints here.
database_id = "REPLACE_WITH_DATABASE_ID"
